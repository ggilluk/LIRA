<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">HTML Crawler and Document Processor Conceptual Architecture</title>
<desc id="desc">One crawler web worker coordinates a pool of HTML processor web workers. Processed LIRA HTML documents feed the Linguistics structure and LinguisticUnit hierarchy.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#102a56}.title{font-size:36px;font-weight:700}.sub{font-size:19px;fill:#2759a5}.h{font-size:22px;font-weight:700}.b{font-size:16px}.small{font-size:14px}.box{fill:#f8fbff;stroke:#7aa7d9;stroke-width:2}.crawler{fill:#effbea;stroke:#65a95d;stroke-width:2}.worker{fill:#f6f1ff;stroke:#8166cf;stroke-width:2}.result{fill:#eef7ff;stroke:#4d91d9;stroke-width:2}.lira{fill:#fff1f3;stroke:#db6f7d;stroke-width:2}.principle{fill:#f1faee;stroke:#76ad68;stroke-width:2}.arrow{stroke:#315f9e;stroke-width:5;fill:none;marker-end:url(#a)}.dispatch{stroke:#7553c5;stroke-width:4;fill:none;marker-end:url(#a)}
</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f9e"/></marker></defs>
<text x="40" y="55" class="title">HTML Crawler &amp; Document Processor — Conceptual Architecture</text><text x="40" y="86" class="sub">From the World Wide Web to LIRA Linguistic Structure</text>
<rect x="35" y="125" width="240" height="540" rx="18" class="box"/><text x="65" y="170" class="h">Web Sources</text><text x="65" y="225" class="b">Web Sites (HTML4/5)</text><text x="65" y="285" class="b">APIs / Feeds</text><text x="65" y="345" class="b">Local HTML</text><text x="65" y="405" class="b">Sitemaps</text><text x="65" y="465" class="b">robots.txt / policy</text>
<rect x="320" y="125" width="300" height="540" rx="18" class="crawler"/><text x="350" y="170" class="h">Crawler Web Worker</text><text x="350" y="198" class="sub">Orchestrator</text><rect x="350" y="235" width="240" height="65" rx="10" class="box"/><text x="375" y="273" class="b">URL Discovery</text><rect x="350" y="320" width="240" height="65" rx="10" class="box"/><text x="375" y="358" class="b">URL Queue / Visited Set</text><rect x="350" y="405" width="240" height="85" rx="10" class="box"/><text x="375" y="440" class="b">Crawl Policy</text><text x="375" y="465" class="small">depth • limits • same-origin</text><rect x="350" y="510" width="240" height="75" rx="10" class="box"/><text x="375" y="548" class="b">Scheduling &amp; Dispatch</text>
<rect x="670" y="125" width="430" height="540" rx="18" class="worker"/><text x="705" y="170" class="h">HTML Processor Worker Pool</text><text x="705" y="198" class="sub">N parallel workers</text><rect x="710" y="235" width="350" height="95" rx="10" class="box"/><text x="735" y="268" class="b">Worker 1</text><text x="735" y="298" class="small">Fetch → Parse → Build LIRA HTML Document</text><rect x="710" y="350" width="350" height="95" rx="10" class="box"/><text x="735" y="383" class="b">Worker 2</text><text x="735" y="413" class="small">Fetch → Parse → Build LIRA HTML Document</text><text x="875" y="485" class="h">⋮</text><rect x="710" y="520" width="350" height="95" rx="10" class="box"/><text x="735" y="553" class="b">Worker N</text><text x="735" y="583" class="small">Fetch → Parse → Build LIRA HTML Document</text>
<rect x="1150" y="125" width="190" height="540" rx="18" class="result"/><text x="1172" y="170" class="h">Results Stream</text><rect x="1175" y="235" width="140" height="75" rx="10" class="box"/><text x="1195" y="268" class="b">LIRA HTML</text><text x="1195" y="292" class="b">Document</text><rect x="1175" y="335" width="140" height="75" rx="10" class="box"/><text x="1195" y="368" class="b">LIRA HTML</text><text x="1195" y="392" class="b">Document</text><text x="1235" y="470" class="h">⋮</text>
<rect x="1380" y="125" width="185" height="540" rx="18" class="lira"/><text x="1400" y="165" class="h">LIRA</text><text x="1400" y="193" class="sub">Linguistics</text><rect x="1400" y="235" width="145" height="70" rx="10" class="box"/><text x="1418" y="277" class="b">LinguisticUnit</text><text x="1410" y="350" class="small">Document</text><text x="1410" y="382" class="small">Sentence</text><text x="1410" y="414" class="small">Clause</text><text x="1410" y="446" class="small">Phrase</text><text x="1410" y="478" class="small">Word</text><text x="1410" y="510" class="small">POS / WordForm</text><text x="1410" y="542" class="small">Text</text><text x="1410" y="600" class="small">Vocabulary linkage</text>
<path d="M275 390 H320" class="arrow"/><path d="M620 390 H670" class="dispatch"/><path d="M1100 390 H1150" class="arrow"/><path d="M1340 390 H1380" class="arrow"/>
<rect x="35" y="710" width="1530" height="145" rx="18" class="principle"/><text x="65" y="750" class="h">Picture in Words — Architectural Principles</text><text x="65" y="790" class="b">Discover: crawler finds and controls URLs.   •   Parallelise: N HTML workers process pages independently.   •   Structure: HTML becomes typed LIRA document data.</text><text x="65" y="825" class="b">Meaning over markup: text enters LinguisticUnit; URLs/media remain typed data.   •   Separate concerns: crawler schedules, processors interpret, Linguistics understands.</text>
</svg>