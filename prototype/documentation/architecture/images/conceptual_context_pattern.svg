<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="330" viewBox="0 0 1500 330" role="img" aria-labelledby="title desc">
<title id="title">Conceptual Context Diagram — Example Pattern</title>
<desc id="desc">Illustrative pattern for a Conceptual Architecture View: Source flows to Acquisition or Input, then Interpretation or Processing, then Canonical LIRA Data, then Downstream LIRA Capability. Each detailed architecture document instantiates its own concrete version of this pattern.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#102a56}
.title{font-size:24px;font-weight:700}
.sub{font-size:14px;fill:#2759a5}
.h{font-size:17px;font-weight:700}
.box{fill:#f8fbff;stroke:#7aa7d9;stroke-width:2;stroke-dasharray:7 5}
.lira{fill:#fff1f3;stroke:#db6f7d;stroke-width:2;stroke-dasharray:7 5}
.arrow{stroke:#315f9e;stroke-width:4;fill:none;marker-end:url(#a)}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315f9e"/></marker></defs>

<text x="750" y="34" text-anchor="middle" class="title">Conceptual Context Diagram — Example Pattern</text>
<text x="750" y="56" text-anchor="middle" class="sub">Illustrative pattern only — each detailed view instantiates its own concrete conceptual diagram</text>

<rect x="20" y="120" width="230" height="90" rx="14" class="box"/>
<text x="135" y="172" text-anchor="middle" class="h">Source</text>

<path d="M250 165 H300" class="arrow"/>

<rect x="300" y="120" width="255" height="90" rx="14" class="box"/>
<text x="427" y="163" text-anchor="middle" class="h">Acquisition /</text>
<text x="427" y="185" text-anchor="middle" class="h">Input</text>

<path d="M555 165 H605" class="arrow"/>

<rect x="605" y="120" width="285" height="90" rx="14" class="box"/>
<text x="747" y="163" text-anchor="middle" class="h">Interpretation /</text>
<text x="747" y="185" text-anchor="middle" class="h">Processing</text>

<path d="M890 165 H940" class="arrow"/>

<rect x="940" y="120" width="270" height="90" rx="14" class="lira"/>
<text x="1075" y="172" text-anchor="middle" class="h">Canonical LIRA Data</text>

<path d="M1210 165 H1260" class="arrow"/>

<rect x="1260" y="120" width="225" height="90" rx="14" class="lira"/>
<text x="1372" y="163" text-anchor="middle" class="h">Downstream LIRA</text>
<text x="1372" y="185" text-anchor="middle" class="h">Capability</text>

<text x="750" y="270" text-anchor="middle" class="sub">Dashed boxes mark this as a template pattern, not a specific implemented architecture.</text>
</svg>
